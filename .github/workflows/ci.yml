name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tool runs on the owner's Windows PC or Mac (DESIGN section 13), so both must stay green.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      # Unit tests are offline (recorded fixtures, network guard in tests/conftest.py) and never launch a browser.
      - run: uv run pytest -q
